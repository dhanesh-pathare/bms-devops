apiVersion: apps/v1
kind: Deployment
metadata:
  name: bms-app
  namespace: bms
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bms-app
  template:
    metadata:
      labels:
        app: bms-app
    spec:
      containers:
        - name: bms-app
          image: dhaneshpathare/bms-devops:latest
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
